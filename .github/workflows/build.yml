name: Build xiaomiao-os

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 用乐鑫官方 IDF Docker 镜像 (预装 ESP-IDF 5.5.4 + 全部工具链),
    # 避免每次从 GitHub Releases 下载工具链超时.
    container:
      image: espressif/idf:v5.5.4
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build firmware
        run: |
          # Docker 镜像已 export IDF 环境, 直接 build
          pwd && ls
          idf.py --version
          idf.py set-target esp32
          idf.py fullclean || true
          idf.py build

      - name: Merge bootloader+app → single bin
        run: |
          mkdir -p dist
          idf.py merge-bin --fill-partition-size -o dist/xiaomiao-os-merged.bin || \
            idf.py merge-bin -o dist/xiaomiao-os-merged.bin
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaomiao-os-firmware
          path: |
            dist/xiaomiao-os-merged.bin
            build/*.bin
            build/*.elf
          retention-days: 14
          if-no-files-found: error