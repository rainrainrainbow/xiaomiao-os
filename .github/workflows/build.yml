name: Build XiaoMiao OS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  ESP_IDF_VERSION: v5.5.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESP-IDF
        uses: espressif/setup-esp-idf@v1
        with:
          version: ${{ env.ESP_IDF_VERSION }}
          target: esp32

      - name: Configure project
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32

      - name: Build
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Merge binary
        run: |
          . $IDF_PATH/export.sh
          idf.py merge-bin -o build/xiaomiao-os-merged.bin

      - name: Check binary size
        run: |
          SIZE=$(stat -c%s build/xiaomiao-os-merged.bin)
          MAX=$((2120 * 1024))
          echo "Binary size: $SIZE bytes / $MAX max"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "ERROR: Binary exceeds ota_0 partition size!"
            exit 1
          fi

      - name: Build summary
        run: |
          SIZE=$(stat -c%s build/xiaomiao-os-merged.bin)
          echo "## XiaoMiao OS Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Binary | $SIZE bytes |" >> $GITHUB_STEP_SUMMARY
          echo "| Max (ota_0) | 2163200 bytes |" >> $GITHUB_STEP_SUMMARY
          echo "| ESP-IDF | v5.5.4 |" >> $GITHUB_STEP_SUMMARY
          echo "| LVGL | 9.5.0 |" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaomiao-os-merged-bin
          path: build/xiaomiao-os-merged.bin
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/log/
            build/CMakeCache.txt
          retention-days: 7
