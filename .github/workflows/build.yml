name: Build XiaoMiao OS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: espressif/idf:v5.5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          idf.py set-target esp32
          idf.py build 2>&1 | tee /tmp/build.log
          if grep -qE "Error:" /tmp/build.log; then
            echo "BUILD FAILED"
            tail -80 /tmp/build.log
            exit 1
          fi

      - name: Merge bin
        run: |
          idf.py merge-bin -o build/xiaomiao-os-merged.bin
          ls -la build/xiaomiao-os-merged.bin
          SIZE=$(stat -c%s build/xiaomiao-os-merged.bin)
          echo "Size: $SIZE bytes"
          if [ "$SIZE" -gt 2228224 ]; then
            echo "TOO LARGE"; exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaomiao-os-merged-bin
          path: build/xiaomiao-os-merged.bin
          retention-days: 30

      - name: Upload logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/build.log
          retention-days: 3
