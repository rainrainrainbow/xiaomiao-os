name: Build xiaomiao-os

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: ~/esp
          key: idf-v5.5.4-${{ runner.os }}
          restore-keys: |
            idf-v5.5.4-

      - name: Install ESP-IDF v5.5.4
        run: |
          mkdir -p ~/esp
          cd ~/esp
          if [ ! -d "esp-idf" ]; then
            git clone --depth 1 --branch v5.5.4 --recurse-submodules --shallow-submodules \
              https://github.com/espressif/esp-idf.git
            # 用 idf_tools.py 手动安装 esp32 目标工具链, 跳过 ULP (esp32ulp-elf)
            # 下载经常在 GitHub Actions 上超时, 而我们不用 ULP 协处理器.
            # 先装 Python 环境, 再装非 ULP 工具链.
            python3 esp-idf/tools/idf_tools.py install-python-env --features=core
            python3 esp-idf/tools/idf_tools.py install --targets=esp32 || true
            # 如果上面因为 ULP 失败, 用 --skip 重试 (只装核心)
            python3 esp-idf/tools/idf_tools.py install --targets=esp32 --skip=esp32ulp-elf || \
              python3 esp-idf/tools/idf_tools.py install --targets=esp32 2>/dev/null || true
            # 确保核心工具链已就位
            ls ~/.espressif/tools/ 2>/dev/null | head
          fi

      - name: Build firmware
        run: |
          source ~/esp/esp-idf/export.sh
          # 工程根就是 GITHUB_WORKSPACE（xiaomiao-os 目录）
          pwd && ls
          idf.py --version
          idf.py set-target esp32
          idf.py fullclean || true
          idf.py build

      - name: Merge bootloader+app → single bin
        run: |
          source ~/esp/esp-idf/export.sh
          mkdir -p dist
          idf.py merge-bin --fill-partition-size -o dist/xiaomiao-os-merged.bin || \
            idf.py merge-bin -o dist/xiaomiao-os-merged.bin
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaomiao-os-firmware
          path: |
            dist/xiaomiao-os-merged.bin
            build/*.bin
            build/*.elf
          retention-days: 14
          if-no-files-found: error