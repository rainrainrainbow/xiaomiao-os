# XiaoMiao OS - Build Pipeline
# Builds ESP-IDF firmware for ESP32-WROVER-B

name: Build Firmware

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build
      
      - name: Generate merged binary
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd build
          python -m esptool --chip esp32 merge_bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            -o merged-binary.bin \
            0x1000 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 xiaomiao-os.bin
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaomiao-os-firmware
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/bootloader/*.bin
            build/partition_table/*.bin
          retention-days: 30
      
      - name: Upload app-only binary (for loader)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xiaomiao-os-app-only
          path: build/xiaomiao-os.bin
          retention-days: 30
      
      - name: Upload merged binary
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xiaomiao-os-merged
          path: build/merged-binary.bin
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: xiaomiao-os-firmware
      
      - name: Get version
        id: version
        run: |
          echo "version=$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: XiaoMiao OS ${{ steps.version.outputs.version }}
          files: |
            *.bin
            *.elf
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}