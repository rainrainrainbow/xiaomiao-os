name: Build Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure project
      run: |
        git config --global --add safe.directory /__w/xiaomiao-os/xiaomiao-os
    
    - name: Build firmware
      run: |
        . $IDF_PATH/export.sh
        idf.py build
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: |
          build/*.bin
          build/*.elf
          build/*.map
        retention-days: 7
