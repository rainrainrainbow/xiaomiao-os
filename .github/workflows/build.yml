name: Build Firmware

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install ESP-IDF
      run: |
        sudo apt-get update
        sudo apt-get install -y wget flex bison gperf python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
        mkdir -p ~/esp
        cd ~/esp
        git clone -b v5.3 --recursive https://github.com/espressif/esp-idf.git
        cd esp-idf
        ./install.sh esp32
    
    - name: Fetch MicroPython
      run: |
        chmod +x scripts/fetch_micropython.sh
        ./scripts/fetch_micropython.sh
    
    - name: Build XiaoMiao OS
      run: |
        source ~/esp/esp-idf/export.sh
        idf.py set-target esp32
        idf.py build
    
    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: xiaomiao-os-firmware
        path: |
          build/merged.bin
          build/*.bin
          build/partition_table/*.bin
          build/bootloader/*.bin
        retention-days: 30
    
    - name: Upload build logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build/
        retention-days: 7